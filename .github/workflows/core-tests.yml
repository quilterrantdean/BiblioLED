name: Core tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install SQLite development files
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  win32-compile:
    name: Win32 compile check (modern Windows SDK)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -A Win32 -DBUILD_TESTING=ON

      - name: Build Win32 application and tests
        run: cmake --build build --config Release --parallel

      - name: Test Win32 SQLite store
        run: ctest --test-dir build -C Release --output-on-failure
