name: Core tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install SQLite development files
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  win32-compile:
    name: Win32 compile check (modern Windows SDK)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure Win32
        run: cmake -S . -B build -A Win32 -DBUILD_TESTING=ON

      - name: Build Win32 application and tests
        run: cmake --build build --config Release --parallel

      - name: Test Win32 SQLite store
        run: ctest --test-dir build -C Release --output-on-failure
  static-analysis:
    name: Cppcheck (portable C++11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Analyse portable C++11 sources and tests
        run: |
          cppcheck --version
          cppcheck \
            --enable=warning,performance,portability \
            --error-exitcode=1 \
            --inline-suppr \
            --std=c++11 \
            --language=c++ \
            -I include \
            src/core \
            src/infrastructure/backup_compression.cpp \
            src/infrastructure/backup_retention.cpp \
            tests/loan_csv_export_tests.cpp \
            tests/loan_rules_tests.cpp \
            tests/loan_statistics_tests.cpp \
            tests/loan_store_tests.cpp \
            tests/backup_compression_tests.cpp \
            tests/backup_retention_tests.cpp

